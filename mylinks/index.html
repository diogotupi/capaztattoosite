  <style>
    :root { color-scheme: dark; --paper: #f5f5f0; --wine: #820006; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; color: var(--paper); font-family: Futura, "Century Gothic", "Trebuchet MS", sans-serif; -webkit-font-smoothing: antialiased; }
    .backdrop { position: fixed; inset: 0; z-index: -1; background: #141414; }
    .backdrop video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); opacity: .65; }
    .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.72) 65%, #0a0a0a); }
    main { min-height: 100svh; width: min(100% - 40px, 440px); margin: auto; padding: 64px 0 28px; display: flex; flex-direction: column; justify-content: center; }
    header { text-align: center; margin-bottom: 38px; }
    .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .32em; margin: 0 0 8px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(80px, 23vw, 116px); font-weight: 600; line-height: 1; letter-spacing: -.055em; margin: 0; }
    .signature { font-size: 10px; letter-spacing: .45em; text-transform: uppercase; margin: 6px 0 24px; }
    .manifesto { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; margin: 0; }
    nav { display: grid; gap: 12px; }
    .link { display: flex; align-items: center; gap: 17px; min-height: 80px; padding: 17px 22px; text-decoration: none; color: inherit; border: 1px solid rgba(245,245,240,.25); background: rgba(10,10,10,.55); backdrop-filter: blur(12px); transition: background .25s, border-color .25s, transform .25s; }
    .link:hover { background: rgba(245,245,240,.12); border-color: var(--paper); transform: translateY(-2px); }
    .link:focus-visible, .motion:focus-visible { outline: 2px solid var(--paper); outline-offset: 5px; }
    .link--primary { background: var(--paper); color: #0a0a0a; border-color: var(--paper); }
    .link--primary:hover { background: #fff; border-color: #fff; }
    .icon { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .copy { flex: 1; }
    .title { display: block; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .detail { display: block; font-size: 11px; opacity: .7; margin-top: 5px; }
    .arrow { font-size: 22px; color: #c7a7a7; }
    .link--primary .arrow { color: var(--wine); }
    footer { margin-top: 38px; text-align: center; }
    .footer-line { width: 26px; height: 1px; background: #a84349; margin: 0 auto 17px; }
    footer p { font-size: 10px; letter-spacing: .14em; opacity: .7; margin: 0; }
    .motion { display: block; margin: 18px auto 0; border: 0; padding: 8px; font: inherit; font-size: 10px; color: var(--paper); opacity: .7; background: transparent; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
    @media (max-width: 380px) { main { width: calc(100% - 32px); padding-top: 40px; } .link { padding: 16px; } }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
  </style>
</head>

    <footer><div class="footer-line"></div><p>Feito de arte. Feito para você.</p><button class="motion" type="button" hidden>Pausar vídeo</button></footer>
  </main>
  <script>
    const video = document.querySelector('video');
    const control = document.querySelector('.motion');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    control.hidden = false;
    const update = () => { control.textContent = video.paused ? 'Reproduzir vídeo' : 'Pausar vídeo'; };
    const play = () => { video.play().catch(update); };
    video.addEventListener('play', update);
    video.addEventListener('pause', update);
    control.addEventListener('click', () => { if (video.paused) play(); else video.pause(); });
    reduced.addEventListener('change', () => { if (reduced.matches) video.pause(); });
    if (!reduced.matches) play();
    update();
  </script>
