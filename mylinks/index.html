<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Tatuagem para quem não tem medo de vestir a própria pele. Agende sua tatuagem, conheça os trabalhos e converse com Camila Paz.">
  <title>Capaz Tattoo · Links</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --paper: #f5f5f0; --wine: #820006; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; color: var(--paper); font-family: Futura, "Century Gothic", "Trebuchet MS", sans-serif; -webkit-font-smoothing: antialiased; }
    .backdrop { position: fixed; inset: 0; z-index: -1; background: #141414; }
    .backdrop video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); opacity: .65; }
    .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.72) 65%, #0a0a0a); }
    main { min-height: 100svh; width: min(100% - 40px, 440px); margin: auto; padding: 64px 0 28px; display: flex; flex-direction: column; justify-content: center; }
    header { text-align: center; margin-bottom: 38px; }
    .languages { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .languages button { min-width: 44px; min-height: 44px; border: 1px solid rgba(245,245,240,.25); background: rgba(10,10,10,.55); color: var(--paper); font: inherit; font-size: 11px; cursor: pointer; }
    .languages button[aria-pressed="true"] { background: var(--paper); color: #0a0a0a; border-color: var(--paper); }
    .languages button:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
    .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .32em; margin: 0 0 8px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(80px, 23vw, 116px); font-weight: 600; line-height: 1; letter-spacing: -.055em; margin: 0; }
    .signature { font-size: 10px; letter-spacing: .45em; text-transform: uppercase; margin: 6px 0 24px; }
    .manifesto { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; margin: 0; }
    nav { display: grid; gap: 12px; }
    .link { display: flex; align-items: center; gap: 17px; min-height: 80px; padding: 17px 22px; text-decoration: none; color: inherit; border: 1px solid rgba(245,245,240,.25); background: rgba(10,10,10,.55); backdrop-filter: blur(12px); transition: background .25s, border-color .25s, transform .25s; }
    .link:hover { background: rgba(245,245,240,.12); border-color: var(--paper); transform: translateY(-2px); }
    .link:focus-visible, .motion:focus-visible { outline: 2px solid var(--paper); outline-offset: 5px; }
    .link--primary { background: var(--paper); color: #0a0a0a; border-color: var(--paper); }
    .link--primary:hover { background: #fff; border-color: #fff; }
    .icon { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .copy { flex: 1; }
    .title { display: block; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .detail { display: block; font-size: 11px; opacity: .7; margin-top: 5px; }
    .arrow { width: 28px; height: 28px; flex: none; color: #c7a7a7; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .arrow-accent { stroke-width: 1; }
    .link--primary .arrow { color: var(--wine); }
    footer { margin-top: 38px; text-align: center; }
    .footer-line { width: 26px; height: 1px; background: #a84349; margin: 0 auto 17px; }
    footer p { font-size: 10px; letter-spacing: .14em; opacity: .7; margin: 0; }
    .motion { display: block; margin: 18px auto 0; border: 0; padding: 8px; font: inherit; font-size: 10px; color: var(--paper); opacity: .7; background: transparent; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
    @media (max-width: 380px) { main { width: calc(100% - 32px); padding-top: 40px; } .link { padding: 16px; } }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <video muted loop playsinline disablepictureinpicture preload="metadata" poster="https://res.cloudinary.com/db5hfdjix/video/upload/so_0,q_auto,f_jpg/v1780847732/vi%CC%81deo_head_site_ffhyry.jpg">
      <source src="https://res.cloudinary.com/db5hfdjix/video/upload/q_auto/f_mp4,vc_h264,ac_none,fl_progressive/v1780847732/vi%CC%81deo_head_site_ffhyry.mp4" type="video/mp4">
    </video>
  </div>
  <main>
    <header>
      <div class="languages" role="group" aria-label="Idioma">
        <button type="button" data-lang="pt" aria-label="Português" aria-pressed="true">PT</button>
        <button type="button" data-lang="en" aria-label="English" aria-pressed="false">EN</button>
        <button type="button" data-lang="es" aria-label="Español" aria-pressed="false">ES</button>
      </div>
      <p class="eyebrow" data-text="eyebrow">Camila Paz · Tattoo & Arte</p>
      <h1>CAPAZ</h1>
      <p class="signature">Tattoo</p>
      <p class="manifesto" data-text="manifesto">Tatuagem para quem não tem medo de vestir a própria pele.</p>
    </header>
    <nav aria-label="Links Capaz Tattoo">
      <a class="link link--primary" href="https://capaz.tattoo/querotatuar">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6L16 3Z M13 6l5 5"/></svg>
        <span class="copy"><span class="title" data-text="formTitle">contato | agendamento</span><span class="detail" data-text="formDetail">Conte sua ideia e peça um orçamento</span></span><svg class="arrow" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 22C10 22 10 16 14 12L23 4M14 4h9v9"/><path class="arrow-accent" d="M4 12v6M1 15h6"/></svg>
      </a>
      <a class="link" href="https://capaz.tattoo/">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
        <span class="copy"><span class="title" data-text="siteTitle">portfolio</span><span class="detail" data-text="siteDetail">Portfólio, artes disponíveis e agenda</span></span><svg class="arrow" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 22C10 22 10 16 14 12L23 4M14 4h9v9"/><path class="arrow-accent" d="M4 12v6M1 15h6"/></svg>
      </a>
      <a class="link" href="https://www.instagram.com/capaz.tattoo/" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>
        <span class="copy"><span class="title">instagram</span><span class="detail" data-text="instagramDetail">@capaz.tattoo · trabalhos e cotidiano</span></span><svg class="arrow" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 22C10 22 10 16 14 12L23 4M14 4h9v9"/><path class="arrow-accent" d="M4 12v6M1 15h6"/></svg>
      </a>
    </nav>
    <footer><div class="footer-line"></div><button class="motion" type="button" hidden>Pausar vídeo</button></footer>
  </main>
  <script>
    const video = document.querySelector('video');
    const control = document.querySelector('.motion');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const translations = {
      pt: { eyebrow: 'Camila Paz · Tattoo & Arte', manifesto: 'Tatuagem para quem não tem medo de vestir a própria pele.', formTitle: 'contato | agendamento', formDetail: 'Conte sua ideia e peça um orçamento', siteTitle: 'portfolio', siteDetail: 'Portfólio, artes disponíveis e agenda', whatsappTitle: 'Vamos conversar?', whatsappDetail: 'Fale comigo pelo WhatsApp', instagramDetail: '@capaz.tattoo · trabalhos e cotidiano', pause: 'Pausar vídeo', play: 'Reproduzir vídeo', language: 'Idioma' },
      en: { eyebrow: 'Camila Paz · Tattoo & Art', manifesto: 'Tattoos for those unafraid to wear their own skin.', formTitle: 'contact | booking', formDetail: 'Share your idea and request a quote', siteTitle: 'portfolio', siteDetail: 'Portfolio, available designs and bookings', whatsappTitle: 'Let’s talk?', whatsappDetail: 'Message me on WhatsApp', instagramDetail: '@capaz.tattoo · work and everyday life', pause: 'Pause video', play: 'Play video', language: 'Language' },
      es: { eyebrow: 'Camila Paz · Tattoo & Arte', manifesto: 'Tatuajes para quienes no temen vestir su propia piel.', formTitle: 'contacto | reservas', formDetail: 'Cuéntame tu idea y pide un presupuesto', siteTitle: 'portafolio', siteDetail: 'Portafolio, diseños disponibles y agenda', whatsappTitle: '¿Hablamos?', whatsappDetail: 'Escríbeme por WhatsApp', instagramDetail: '@capaz.tattoo · trabajos y vida cotidiana', pause: 'Pausar video', play: 'Reproducir video', language: 'Idioma' }
    };
    let language = 'pt';
    control.hidden = false;
    const update = () => { control.textContent = translations[language][video.paused ? 'play' : 'pause']; };
    const setLanguage = (lang) => {
      if (!Object.hasOwn(translations, lang)) return;
      language = lang;
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
      document.querySelectorAll('[data-text]').forEach(el => { el.textContent = translations[lang][el.dataset.text]; });
      document.querySelectorAll('[data-lang]').forEach(button => { button.setAttribute('aria-pressed', String(button.dataset.lang === lang)); });
      document.querySelector('.languages').setAttribute('aria-label', translations[lang].language);
      try { localStorage.setItem('capaz-mylinks-lang', lang); } catch {}
      update();
    };
    document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
    try { const saved = localStorage.getItem('capaz-mylinks-lang'); if (saved) setLanguage(saved); } catch {}
    const play = () => { video.play().catch(update); };
    video.addEventListener('play', update);
    video.addEventListener('pause', update);
    control.addEventListener('click', () => { if (video.paused) play(); else video.pause(); });
    reduced.addEventListener('change', () => { if (reduced.matches) video.pause(); });
    if (!reduced.matches) play();
    update();
  </script>
</body>
</html>
